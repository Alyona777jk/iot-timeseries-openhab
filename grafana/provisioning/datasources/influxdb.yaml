apiVersion: 1
datasources:
  - name: InfluxDB_v2_Flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: iot_org
      defaultBucket: openhab_raw
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-auth-token
